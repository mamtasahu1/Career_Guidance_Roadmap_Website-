<!DOCTYPE html>
<html lang="en">

<head>
  <script src="config.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reset your Xyverra password" />
  <title>Forgot Password - Xyverra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="login.css" />
  <style>
  @media (max-width: 480px) {
    .login-form input[type="email"] {
      font-size: 16px !important;
    }
    .btn-login {
      min-height: 44px;
    }
    .login-card {
      width: 100%;
    }
  }
  </style>
</head>

<body>
  <!-- Toast Container -->
  <div id="xv-toast-container" class="xv-toast-container"></div>

  <!-- Centered Login Card -->
  <div class="login-page">
    <div class="login-card">

      <!-- Brand Header -->
      <div class="login-brand">
        <img src="xyverra_logo.jpeg" alt="Xyverra Logo" class="brand-logo-img">
        <span class="brand-name">Xyverra</span>
      </div>

      <div class="login-heading">
        <h1>Forgot Password?</h1>
        <p>Enter your email address to get a password reset link.</p>
      </div>

      <!-- Form -->
      <form id="forgot-password-form" class="login-form" novalidate autocomplete="off">

        <!-- General error card -->
        <div id="general-error" class="inline-error-card" role="alert" aria-live="polite">
            <span class="err-icon">⚠</span>
            <span id="error-text"></span>
        </div>
        
        <!-- General success card -->
        <div id="general-success" class="inline-error-card" style="background: rgba(16,185,129,0.1); color: #10b981; border: 1px solid rgba(16,185,129,0.2); display: none;" role="alert" aria-live="polite">
            <span class="err-icon" style="color: #10b981;">✓</span>
            <span id="success-text"></span>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrapper">
            <i class="far fa-envelope input-icon"></i>
            <input type="email" id="email" name="email" placeholder="name@company.com"
              autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" required />
          </div>
          <div id="email-error" class="inline-field-error" role="alert"></div>
        </div>

        <button type="submit" class="btn-login" id="submit-btn">
          <span id="btn-label">Send Reset Link</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <!-- Divider -->
      <div class="login-divider"><span>Remember your password?</span></div>

      <!-- Sign In Link -->
      <a href="login.html" class="btn-signup">
        <i class="fas fa-sign-in-alt"></i>
        Back to Login
      </a>

    </div>
  </div>
  <script src="toast.js"></script>
  <script src="forgot-password.js"></script>
</body>

</html>
