?<!DOCTYPE html>
<html lang="en">
<head>
  <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Mode - Xyverra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="auth-guard.js?v=2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }

        /* ✨ Header ✨ */
        .study-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.9rem 2rem; background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            position: sticky; top: 0; z-index: 100;
            gap: 1rem;
        }
        .study-header-left { display: flex; align-items: center; gap: 1rem; min-width: 0; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.55rem 1.1rem; border: 1.5px solid #e2e8f0;
            border-radius: 8px; color: #334155; font-weight: 600;
            font-size: 0.875rem; text-decoration: none; cursor: pointer;
            background: #f8fafc; transition: all 0.18s; white-space: nowrap;
        }
        .back-btn:hover { background: #eff6ff; border-color: #3b82f6; color: #2563eb; }
        .course-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.1rem; font-weight: 700; color: #0f172a;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 45vw;
        }
        .study-header-right { display: flex; gap: 0.75rem; align-items: center; flex-shrink: 0; }
        .btn-complete {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.55rem 1.2rem; border: none; border-radius: 8px;
            font-weight: 600; font-size: 0.875rem; cursor: pointer;
            background: #16a34a; color: #fff; transition: all 0.18s;
        }
        .btn-complete:hover { background: #15803d; transform: translateY(-1px); }
        .btn-complete:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

        /* ✨ Content area ✨ */
        .content-area {
            flex: 1; overflow-y: auto;
            padding: 2.5rem clamp(1rem, 5vw, 5rem);
            max-width: 900px; width: 100%; margin: 0 auto;
        }

        /* ✨ Loader ✨ */
        .loader-wrap {
            position: fixed; inset: 64px 0 0 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #f8fafc; z-index: 50;
        }
        .spinner {
            width: 44px; height: 44px;
            border: 4px solid rgba(37,99,235,0.12);
            border-top-color: #2563eb; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { color: #64748b; font-weight: 500; font-size: 0.95rem; }

        /* ✨ Markdown styles ✨ */
        #markdown-body h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 2rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem; padding-bottom: 0.75rem; border-bottom: 2px solid #e2e8f0; }
        #markdown-body h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.4rem; font-weight: 700; color: #1e293b; margin: 2rem 0 0.75rem; }
        #markdown-body h3 { font-size: 1.1rem; font-weight: 700; color: #334155; margin: 1.5rem 0 0.5rem; }
        #markdown-body p { color: #475569; line-height: 1.8; margin-bottom: 1rem; font-size: 1rem; }
        #markdown-body ul, #markdown-body ol { padding-left: 1.5rem; margin-bottom: 1rem; }
        #markdown-body li { color: #475569; line-height: 1.8; margin-bottom: 0.35rem; font-size: 1rem; }
        #markdown-body strong { color: #1e293b; font-weight: 700; }
        #markdown-body code { background: #f1f5f9; color: #be185d; padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.88em; font-family: 'Courier New', monospace; }
        #markdown-body pre { background: #0f172a; border-radius: 10px; padding: 1.25rem 1.5rem; margin: 1.25rem 0; overflow-x: auto; }
        #markdown-body pre code { background: none; color: #e2e8f0; font-size: 0.9rem; padding: 0; }
        #markdown-body blockquote { border-left: 4px solid #3b82f6; background: #eff6ff; padding: 1rem 1.25rem; border-radius: 0 8px 8px 0; margin: 1.25rem 0; }
        #markdown-body blockquote p { color: #1e40af; margin: 0; }
        #markdown-body table { width: 100%; border-collapse: collapse; margin: 1.25rem 0; font-size: 0.95rem; }
        #markdown-body th { background: #f1f5f9; padding: 0.65rem 1rem; text-align: left; font-weight: 700; color: #1e293b; border: 1px solid #e2e8f0; }
        #markdown-body td { padding: 0.65rem 1rem; color: #475569; border: 1px solid #e2e8f0; }
        #markdown-body tr:nth-child(even) td { background: #f8fafc; }
        #markdown-body hr { border: none; border-top: 1.5px solid #e2e8f0; margin: 2rem 0; }
        #markdown-body a { color: #2563eb; text-decoration: underline; }

        /* ✨ Error box ✨ */
        .error-box {
            background: #fef2f2; border: 1px solid #fecaca;
            border-radius: 10px; padding: 1.5rem 2rem;
            color: #991b1b; text-align: center; margin-top: 3rem;
        }

        @media (max-width: 640px) {
            .study-header { padding: 0.75rem 1rem; flex-wrap: wrap; }
            .course-title { max-width: 60vw; font-size: 0.95rem; }
            .content-area { padding: 1.5rem 1rem; }
            #markdown-body h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="study-header">
        <div class="study-header-left">
            <a href="roadmap.html" id="back-btn" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </a>
            <h1 class="course-title" id="display-title">Loading...</h1>
        </div>
        <div class="study-header-right">
            <button type="button" id="mark-complete" class="btn-complete">
                <i class="fas fa-check-circle"></i>
                <span id="complete-label">Mark as Complete</span>
            </button>
        </div>
    </header>

    <!-- Loader -->
    <div class="loader-wrap" id="loader">
        <div class="spinner"></div>
        <span class="loader-text">Loading lesson...</span>
    </div>

    <!-- Content -->
    <div class="content-area" id="content-area" style="display:none;">
        <div id="markdown-body"></div>
    </div>

    <script>
    (function() {
        const params  = new URLSearchParams(window.location.search);
        const rawUrl  = params.get('url')   || '';
        const title   = params.get('title') || 'Lesson';
        const courseId = params.get('courseId') || rawUrl;
        const moduleId = params.get('moduleId') || '';
        const returnTo = params.get('returnTo') || 'roadmap';

        const loader       = document.getElementById('loader');
        const contentArea  = document.getElementById('content-area');
        const mdBody       = document.getElementById('markdown-body');
        const titleEl      = document.getElementById('display-title');
        const completeBtn  = document.getElementById('mark-complete');
        const backBtn      = document.getElementById('back-btn');

        titleEl.textContent = title;
        document.title = title + ' - Xyverra';

        // ✨ Back: prefer real browser history (keeps roadmap scroll position etc.),
        // fall back to the roadmap page directly if this tab has no prior entry
        // (e.g. opened via a direct link). The href="roadmap.html" already covers
        // the no-JS case. ✨
        if (backBtn) {
            backBtn.addEventListener('click', (e) => {
                if (window.history.length > 1 && document.referrer) {
                    e.preventDefault();
                    window.history.back();
                }
            });
        }

        const completionKey = courseId || rawUrl;

        // ✨ Render the button as already-completed (disabled, ✅ state) ✨
        function showCompletedState() {
            completeBtn.innerHTML = '<i class="fas fa-check-circle"></i> <span>Completed</span>';
            completeBtn.style.background = '#166534';
            completeBtn.disabled = true;
        }

        // ✨ Check completion status on load: localStorage first (instant),
        //    then the backend (authoritative ??" survives logout/new device) ✨
        function isCompletedLocally() {
            try {
                const arr = JSON.parse(localStorage.getItem('completedCourses') || '[]');
                return arr.includes(completionKey);
            } catch (e) { return false; }
        }

        if (isCompletedLocally()) {
            showCompletedState();
        }

        (async function checkServerCompletionStatus() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token || !completionKey) return;
            try {
                const res = await fetch('http://localhost:5000/api/user/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) return;
                const data = await res.json();
                const completedLessons = (data && data.user && data.user.completedLessons) || [];
                if (completedLessons.includes(completionKey)) {
                    // Backfill localStorage so the roadmap page's checkmarks stay in sync too.
                    try {
                        const arr = JSON.parse(localStorage.getItem('completedCourses') || '[]');
                        if (!arr.includes(completionKey)) {
                            arr.push(completionKey);
                            localStorage.setItem('completedCourses', JSON.stringify(arr));
                        }
                    } catch (e) { /* ignore */ }
                    showCompletedState();
                }
            } catch (e) {
                console.warn('Failed to check server completion status:', e);
            }
        })();

        function showContent(mdText) {
            if (window.marked) {
                mdBody.innerHTML = window.marked.parse(mdText);
            } else {
                mdBody.innerHTML = '<pre style="white-space:pre-wrap;font-family:inherit;">' + mdText + '</pre>';
            }
            loader.style.display = 'none';
            contentArea.style.display = 'block';
        }

        function showError(msg) {
            mdBody.innerHTML = '<div class="error-box"><i class="fas fa-exclamation-circle" style="font-size:2rem;margin-bottom:0.75rem;"></i><br><strong>' + msg + '</strong></div>';
            loader.style.display = 'none';
            contentArea.style.display = 'block';
        }

        // ✨ Try loading content ✨
        if (rawUrl.endsWith('.md')) {
            // Always fetch fresh content
            fetch(rawUrl + '?t=' + new Date().getTime()) // cache busting query param
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(function(text) {
                    // Update the cache with the new text just in case other pages use it
                    localStorage.setItem('xyverra_lesson_' + rawUrl, text);
                    showContent(text);
                })
                .catch(function() {
                    showError('Could not load the lesson file. Make sure the app is running on a local server (not opened as a file://).');
                });
        } else {
            showError('No lesson content found. Please go back and try again.');
        }

        // ✨ Persist lesson completion to the backend ✨
        // Two separate, complementary writes:
        //  1. mark-viewed  ??' whole-module "studied" status (Progress + User.studiedLessons) ??" unchanged, existing behaviour
        //  2. mark-lesson-complete ??' THIS specific lesson, permanently, in User.completedLessons
        //     (this is what lets the button correctly show "Completed" on every future visit)
        async function reportModuleStudied() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!moduleId || !token) return;
            try {
                const roadmapId = localStorage.getItem('xyverra_selected_path') || moduleId;
                await fetch('http://localhost:5000/api/progress/mark-viewed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ moduleId, roadmapId })
                });
            } catch (e) {
                console.warn('Failed to sync lesson progress to server:', e);
            }
        }

        async function reportLessonComplete() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token || !completionKey) return;
            try {
                const res = await fetch('http://localhost:5000/api/progress/mark-lesson-complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ courseId: completionKey })
                });
                const data = await res.json();
                if (data && data.success) {
                    if (typeof data.readinessScore === 'number') localStorage.setItem('xyverra_readiness_score', String(data.readinessScore));
                    if (typeof data.experienceRank === 'number') localStorage.setItem('xyverra_xp', String(data.experienceRank));
                    if (Array.isArray(data.completedRoadmaps)) localStorage.setItem('completedRoadmaps', JSON.stringify(data.completedRoadmaps));
                }
            } catch (e) {
                console.warn('Failed to persist lesson completion to server:', e);
            }
        }

        // ✨ Mark as Complete ✨
        async function markComplete() {
            // Guard against duplicate/double-click submissions.
            if (completeBtn.disabled) return;
            completeBtn.disabled = true;
            completeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            try {
                // Mark in completedCourses (drives roadmap unlock/checkmarks)
                const raw = localStorage.getItem('completedCourses');
                const arr = (raw ? JSON.parse(raw) : []);
                const key = completionKey;
                if (!arr.includes(key)) arr.push(key);
                localStorage.setItem('completedCourses', JSON.stringify(arr));

                // Persist to MongoDB (fire-and-forget is OK; localStorage is immediate fallback)
                await Promise.all([reportModuleStudied(), reportLessonComplete()]);

                // Visual feedback
                showCompletedState();

                // Return to roadmap after brief delay
                setTimeout(function() {
                    const url = 'roadmap.html?returnTo=' + encodeURIComponent(returnTo) +
                                '&completed=' + encodeURIComponent(key) +
                                (moduleId ? '&moduleId=' + encodeURIComponent(moduleId) : '');
                    window.location.href = url;
                }, 600);
            } catch(e) {
                window.location.href = 'roadmap.html';
            }
        }

        completeBtn.addEventListener('click', markComplete);
    })();
    </script>

</body>
</html>
