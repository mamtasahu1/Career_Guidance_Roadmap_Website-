<!DOCTYPE html>
<html lang="en">

<head>
  <script src="config.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reset your Xyverra password" />
  <title>Reset Password - Xyverra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="login.css" />
  <style>
  @media (max-width: 480px) {
    .login-form input[type="password"] {
      font-size: 16px !important;
    }
    .btn-login {
      min-height: 44px;
    }
    .login-card {
      width: 100%;
    }
  }
  
  .password-requirements {
    font-size: 0.8rem;
    color: #64748b;
    margin-top: 8px;
    padding-left: 10px;
    list-style: none;
  }
  .password-requirements li {
    margin-bottom: 4px;
  }
  .password-requirements li.valid {
    color: #10b981;
  }
  .password-requirements li.invalid {
    color: #ef4444;
  }
  </style>
</head>

<body>
  <!-- Toast Container -->
  <div id="xv-toast-container" class="xv-toast-container"></div>

  <!-- Centered Login Card -->
  <div class="login-page">
    <div class="login-card">

      <!-- Brand Header -->
      <div class="login-brand">
        <img src="xyverra_logo.jpeg" alt="Xyverra Logo" class="brand-logo-img">
        <span class="brand-name">Xyverra</span>
      </div>

      <div class="login-heading">
        <h1>Set New Password</h1>
        <p>Please enter your new password below.</p>
      </div>

      <!-- Form -->
      <form id="reset-password-form" class="login-form" novalidate autocomplete="off">

        <!-- General error card -->
        <div id="general-error" class="inline-error-card" role="alert" aria-live="polite">
            <span class="err-icon">⚠</span>
            <span id="error-text"></span>
        </div>
        
        <!-- General success card -->
        <div id="general-success" class="inline-error-card" style="background: rgba(16,185,129,0.1); color: #10b981; border: 1px solid rgba(16,185,129,0.2); display: none;" role="alert" aria-live="polite">
            <span class="err-icon" style="color: #10b981;">✓</span>
            <span id="success-text"></span>
        </div>

        <div class="form-group">
          <label for="new-password">New Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="new-password" name="new-password" placeholder="Enter new password"
              autocomplete="new-password" required />
            <i class="far fa-eye eye-icon toggle-password" title="Show password" role="button" tabindex="0"></i>
          </div>
          <ul class="password-requirements" id="password-requirements">
              <li id="req-length" class="invalid"><i class="fas fa-times" style="margin-right: 6px;"></i> Min. 8 characters</li>
              <li id="req-upper" class="invalid"><i class="fas fa-times" style="margin-right: 6px;"></i> At least one uppercase letter</li>
              <li id="req-lower" class="invalid"><i class="fas fa-times" style="margin-right: 6px;"></i> At least one lowercase letter</li>
              <li id="req-number" class="invalid"><i class="fas fa-times" style="margin-right: 6px;"></i> At least one number</li>
              <li id="req-special" class="invalid"><i class="fas fa-times" style="margin-right: 6px;"></i> At least one special character</li>
          </ul>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm new password"
              autocomplete="new-password" required />
            <i class="far fa-eye eye-icon toggle-password" title="Show password" role="button" tabindex="0"></i>
          </div>
          <div id="confirm-error" class="inline-field-error" role="alert"></div>
        </div>

        <button type="submit" class="btn-login" id="submit-btn" disabled>
          <span id="btn-label">Update Password</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>

    </div>
  </div>
  <script src="toast.js"></script>
  <script src="reset-password.js"></script>
</body>

</html>
