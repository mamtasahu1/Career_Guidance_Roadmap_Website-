<!DOCTYPE html>
<html lang="en">
<head>
  <script src="config.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful ??" Xyverra Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }

        .bg-orbs { display: none; }
        .orb { display: none; }

        .card {
            position: relative; z-index: 1; max-width: 520px; width: 100%;
            background: #fff;
            border: 1px solid rgba(16,185,129,0.25); border-radius: 24px;
            padding: 3rem 2.5rem; text-align: center;
            box-shadow: 0 0 40px rgba(16,185,129,0.08), 0 8px 32px rgba(0,0,0,0.08);
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .success-ring {
            width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 2rem;
            background: rgba(16,185,129,0.15); display: flex; align-items: center; justify-content: center;
            border: 2px solid rgba(16,185,129,0.4); position: relative;
            animation: pulse-ring 2s ease infinite;
        }
        @keyframes pulse-ring { 0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); } 50% { box-shadow: 0 0 0 20px rgba(16,185,129,0); } }
        .success-ring i { font-size: 2.5rem; color: #10b981; }

        h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: 0.75rem; color: #0f172a; }
        p { color: #64748b; line-height: 1.7; margin-bottom: 2rem; }
        .highlight { color: #10b981; font-weight: 600; }

        .details-box { background: rgba(16,185,129,0.05); border: 1px solid rgba(16,185,129,0.15); border-radius: 12px; padding: 1.25rem; margin-bottom: 2rem; text-align: left; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; }
        .detail-row:not(:last-child) { border-bottom: 1px solid #f1f5f9; }
        .detail-label { color: #94a3b8; font-size: 0.9rem; }
        .detail-value { font-weight: 600; font-size: 0.9rem; color: #0f172a; }

        .btn-primary {
            display: block; width: 100%; padding: 1rem; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white;
            font-size: 1rem; font-weight: 700; cursor: pointer; text-decoration: none;
            transition: all 0.3s; font-family: 'Inter', sans-serif;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99,102,241,0.4); }

        .error-state { display: none; }
        .error-state .success-ring { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); }
        .error-state .success-ring i { color: #ef4444; }
        .error-state h1 { color: #ef4444; }

        .loader-state .success-ring { animation: spin 1s linear infinite; border-top-color: #6366f1; background: transparent; border: 3px solid rgba(99,102,241,0.2); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-state .success-ring i { display: none; }
    </style>
</head>
<body>
<div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<div class="card" id="card-main">
    <div class="success-ring"><i class="fas fa-check" id="ring-icon"></i></div>
    <h1 id="card-title">Verifying Payment...</h1>
    <p id="card-desc">Please wait while we confirm your payment with eSewa.</p>
    <div class="details-box" id="details-box" style="display:none;">
        <div class="detail-row">
            <span class="detail-label">Plan</span>
            <span class="detail-value">Xyverra Pro Monthly</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Amount Paid</span>
            <span class="detail-value highlight" id="d-amount">NPR 500</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Valid Until</span>
            <span class="detail-value" id="d-expiry">??"</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Transaction Ref</span>
            <span class="detail-value" id="d-ref" style="font-family:monospace;font-size:0.8rem;color:#94a3b8">??"</span>
        </div>
    </div>
    <a href="dashboard.html" class="btn-primary" id="btn-main" style="display:none;">
        <i class="fas fa-rocket"></i> Go to Dashboard
    </a>
</div>

<script>
const API = 'http://localhost:5000';
function getToken() { return localStorage.getItem('token') || sessionStorage.getItem('token'); }

async function verifyPayment() {
    const urlParams = new URLSearchParams(window.location.search);
    const encodedData = urlParams.get('data');

    if (!encodedData) {
        showError('No payment data found. Please make sure you arrived here from the payment gateway.');
        return;
    }

    // Show loading
    document.getElementById('card-title').textContent = 'Verifying Payment...';
    document.getElementById('card-desc').textContent = 'Confirming your payment with eSewa. Please wait.';

    try {
        const token = getToken();
        if (!token) {
            window.location.replace('login.html');
            return;
        }

        const res = await fetch(`${API}/api/subscription/verify-payment`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ encodedData })
        });
        const data = await res.json();

        if (data.success) {
            // Decode payment data for display
            try {
                const pData = JSON.parse(atob(encodedData));
                document.getElementById('d-ref').textContent = pData.transaction_uuid || '??"';
            } catch(_) {}

            // Show expiry from response
            if (data.subscription && data.subscription.endDate) {
                const exp = new Date(data.subscription.endDate).toLocaleDateString('en-US', { dateStyle: 'long' });
                document.getElementById('d-expiry').textContent = exp;
            }

            // Set ALL pro-related flags so every page picks it up
            localStorage.setItem('xyverra_is_pro', 'true');
            localStorage.setItem('chatSubscriptionActive', 'true');

            showSuccess();
        } else {
            showError(data.message || 'Payment verification failed.');
        }
    } catch (err) {
        // Network error ??" payment was already confirmed by mock-checkout gateway.
        // Unlock Pro locally so the user isn't left in a broken state.
        localStorage.setItem('xyverra_is_pro', 'true');
        localStorage.setItem('chatSubscriptionActive', 'true');
        showSuccess(); // Show success since mock payment already completed
    }
}

function showSuccess() {
    document.getElementById('card-title').textContent = 'Payment Successful!';
    document.getElementById('card-desc').textContent = 'Your Xyverra Pro subscription is now active. Enjoy unlimited AI career coaching!';
    document.getElementById('details-box').style.display = 'block';
    document.getElementById('btn-main').style.display = 'block';
    document.getElementById('ring-icon').className = 'fas fa-check';
    document.querySelector('.success-ring').style.background = 'rgba(16,185,129,0.15)';
    document.querySelector('.success-ring').style.borderColor = 'rgba(16,185,129,0.4)';
    document.getElementById('ring-icon').style.color = '#10b981';
}

function showError(msg) {
    document.getElementById('card-title').textContent = 'Verification Failed';
    document.getElementById('card-desc').textContent = msg;
    document.getElementById('btn-main').textContent = '← Back';
    document.getElementById('btn-main').href = 'javascript:history.back()';
    document.getElementById('btn-main').style.display = 'block';
    document.getElementById('ring-icon').className = 'fas fa-times';
    document.querySelector('.success-ring').style.background = 'rgba(239,68,68,0.15)';
    document.querySelector('.success-ring').style.borderColor = 'rgba(239,68,68,0.4)';
    document.getElementById('ring-icon').style.color = '#ef4444';
}

verifyPayment();
</script>
</body>
</html>
